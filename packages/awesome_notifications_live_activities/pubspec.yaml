name: awesome_notifications_live_activities
description: "Live activities for awesome_notifications: iOS Live Activities (Lock Screen, Dynamic Island), Android Live Updates, and an in-place progress notification on macOS, Windows, Linux and Web, from one model."
version: 1.0.0-dev
homepage:
resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  awesome_notifications: ^1.0.0-dev

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: me.carda.awesome_notifications_live_activities
        pluginClass: AwesomeNotificationsLiveActivitiesPlugin
      ios:
        pluginClass: AwesomeNotificationsLiveActivitiesPlugin
      macos:
        pluginClass: AwesomeNotificationsLiveActivitiesPlugin
      linux:
        pluginClass: AwesomeNotificationsLiveActivitiesPlugin
      windows:
        pluginClass: AwesomeNotificationsLiveActivitiesPluginCApi
      web:
        pluginClass: AwesomeNotificationsLiveActivitiesWeb
        fileName: awesome_notifications_live_activities_web.dart
