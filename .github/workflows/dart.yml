# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "master", "hotfix", "development", "release" ]
  pull_request:
    branches: [ "master", "hotfix", "development", "release" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - id: flutter-action
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Analyze all packages
        run: melos exec -- flutter analyze --no-fatal-infos

      # Each package is tested with coverage and its lcov is uploaded to Codecov
      # under its own flag, so every package reports its own statistic.
      - name: Test — awesome_notifications
        run: flutter test --coverage
        working-directory: packages/awesome_notifications
      - name: Upload coverage — awesome_notifications
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: awesome_notifications
          files: packages/awesome_notifications/coverage/lcov.info

      - name: Test — awesome_notifications_schedules
        run: flutter test --coverage
        working-directory: packages/awesome_notifications_schedules
      - name: Upload coverage — awesome_notifications_schedules
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: awesome_notifications_schedules
          files: packages/awesome_notifications_schedules/coverage/lcov.info

      - name: Test — awesome_notifications_localizations
        run: flutter test --coverage
        working-directory: packages/awesome_notifications_localizations
      - name: Upload coverage — awesome_notifications_localizations
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: awesome_notifications_localizations
          files: packages/awesome_notifications_localizations/coverage/lcov.info

      - name: Test — awesome_notifications_fcm
        run: flutter test --coverage
        working-directory: packages/awesome_notifications_fcm
      - name: Upload coverage — awesome_notifications_fcm
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: awesome_notifications_fcm
          files: packages/awesome_notifications_fcm/coverage/lcov.info
