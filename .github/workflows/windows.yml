name: Windows

# Builds the Windows native side of the plugins on a GitHub-hosted Windows VM.
# It only proves the C++ compiles and links (and, once they exist, runs the
# native unit tests); toast display is verified manually on a real desktop.
on:
  push:
    branches: [ "master", "hotfix", "development", "release", "feature/monorepo-**" ]
  pull_request:
    branches: [ "master", "hotfix", "development", "release" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        # bash -e: stop at the first failing command (PowerShell would not).
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # The portable desktop core (shared with Linux), under MSVC /W4 /WX.
      - name: Desktop core unit tests
        run: |
          cmake -S packages/awesome_notifications/desktop/awn_core/tests -B build/awn_core_tests
          cmake --build build/awn_core_tests --config Debug
          ctest --test-dir build/awn_core_tests -C Debug --output-on-failure

      # The core example also depends on the schedules decorator, so this
      # builds both plugins' Windows code.
      - name: Build core example (Windows)
        working-directory: packages/awesome_notifications/example
        run: |
          flutter pub get
          flutter build windows --debug
