name: Linux

# Builds the Linux native side of the plugins and runs the 0.12 compat suite
# against a real freedesktop notification server (dunst) on a virtual display.
on:
  push:
    branches: [ "master", "hotfix", "development", "release", "feature/monorepo-**" ]
  pull_request:
    branches: [ "master", "hotfix", "development", "release" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # The version the packages are developed and verified with.
          flutter-version: '3.47.3'

      - name: Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb dbus-x11 dunst libnotify-bin

      # The portable desktop core, shared with Windows.
      - name: Desktop core unit tests
        run: |
          cmake -S packages/awesome_notifications/desktop/awn_core/tests -B build/awn_core_tests
          cmake --build build/awn_core_tests
          ctest --test-dir build/awn_core_tests --output-on-failure

      - name: Desktop scheduling unit tests
        run: |
          cmake -S packages/awesome_notifications_schedules/desktop/awn_schedules/tests -B build/awn_schedules_tests
          cmake --build build/awn_schedules_tests
          ctest --test-dir build/awn_schedules_tests --output-on-failure

      - name: Desktop localization unit tests
        run: |
          cmake -S packages/awesome_notifications_localizations/desktop/awn_localizations/tests -B build/awn_localizations_tests
          cmake --build build/awn_localizations_tests
          ctest --test-dir build/awn_localizations_tests --output-on-failure

      - name: Build the examples (Linux)
        run: |
          for package in awesome_notifications awesome_notifications_schedules awesome_notifications_localizations; do
            (cd packages/$package/example && flutter pub get && flutter build linux --debug)
          done

      # The same black-box suite as on Android / iOS / macOS / Windows, held to
      # the 0.12 Android reference.
      - name: Compat suite (Linux)
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          eval "$(dbus-launch --sh-syntax)"
          dunst &
          sleep 1
          cd compat_tests/app_v1
          flutter pub get
          flutter test integration_test/compat_test.dart -d linux -r expanded
